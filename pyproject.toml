[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuttal-sidecar"
version = "0.1.0"
description = "Lightweight local LaTeX rebuttal companion with sandboxed latexdiff preview and reviewer todo board."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bottle>=0.12.25",
    "watchdog>=4.0.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "nuitka>=2.4",
    "ordered-set>=4.1.0",
    "zstandard>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
