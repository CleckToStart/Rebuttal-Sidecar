<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rebuttal Sidecar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="module" src="/app.js"></script>
</head>
<body x-data="sidecarApp" x-cloak :class="{ 'desktop-frameless': isDesktopShell, 'is-maximized': isWindowMaximized }">
  <!-- 8-direction edge/corner resize handles for frameless desktop window -->
  <template x-if="isDesktopShell && !isWindowMaximized">
    <div class="win-resize-layer">
      <div class="win-resize win-resize-n" @pointerdown.prevent="startWindowResize('n')"></div>
      <div class="win-resize win-resize-s" @pointerdown.prevent="startWindowResize('s')"></div>
      <div class="win-resize win-resize-w" @pointerdown.prevent="startWindowResize('w')"></div>
      <div class="win-resize win-resize-e" @pointerdown.prevent="startWindowResize('e')"></div>
      <div class="win-resize win-resize-nw" @pointerdown.prevent="startWindowResize('nw')"></div>
      <div class="win-resize win-resize-ne" @pointerdown.prevent="startWindowResize('ne')"></div>
      <div class="win-resize win-resize-sw" @pointerdown.prevent="startWindowResize('sw')"></div>
      <div class="win-resize win-resize-se" @pointerdown.prevent="startWindowResize('se')"></div>
    </div>
  </template>
  <div class="app-drag-strip" x-show="isDesktopShell" @dblclick="toggleMaximizeWindow()"></div>
  <div class="app-shell">
    <!-- Left Codex-Style Workspace & Project Tree Sidebar -->
    <aside class="sidebar" :class="sidebarExpanded ? 'sidebar-expanded' : 'sidebar-collapsed'">
      <template x-if="!sidebarExpanded">
        <div class="rail-top">
          <div class="brand-glyph" title="Rebuttal Sidecar">
            <img src="/favicon.svg" alt="" width="24" height="24" />
          </div>
          <button class="rail-btn" @click="toggleSidebar(true)" title="展开项目工作区">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button
            class="rail-btn"
            :class="{ active: activeWorkbench === 'paper' ? !todoCollapsed : !patentFeedbackCollapsed }"
            @click="activeWorkbench === 'paper' ? toggleTodoCollapse() : togglePatentFeedbackCollapse()"
            :title="activeWorkbench === 'paper' ? '展开/收起审稿意见看板' : '展开/收起代理/审查意见看板'"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
          <button class="rail-btn" @click="activeWorkbench === 'paper' ? openImportModal() : openPatentModal()" :title="activeWorkbench === 'paper' ? '导入项目工程' : '新建或导入专利'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6m-3-3h6"/></svg>
          </button>
          <button class="rail-btn" @click="openHelpModal(activeWorkbench === 'patent' ? 'patent_init' : 'init')" title="帮助与 AI 提示词助手">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 1c0 1.5-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
          </button>
        </div>
      </template>
      <template x-if="!sidebarExpanded">
        <div class="rail-bottom">
          <button class="rail-btn" @click="activeWorkbench === 'paper' ? openCompilerModal() : openPatentSettings()" :title="activeWorkbench === 'paper' ? '编译器设置' : '生命周期与年费提醒设置'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </template>

      <!-- Paper Sidebar Expanded -->
      <template x-if="sidebarExpanded && activeWorkbench === 'paper'">
        <div style="display:flex;flex-direction:column;gap:10px;height:100%;min-height:0;">
          <div class="sidebar-top-row">
            <div class="brand-glyph brand-glyph-inline" title="Rebuttal Sidecar">
              <img src="/favicon.svg" alt="" width="22" height="22" />
            </div>
            <button class="btn btn-mint btn-sm" style="flex:1;" @click="openImportModal()">+ 导入项目</button>
            <button class="mini-icon-btn" @click="toggleSidebar(false)" title="收起侧边栏">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>

          <div class="sidebar-section-label">
            <span>工作区与历史项目</span>
            <span x-text="workspaceHistory().length + ' 项'"></span>
          </div>

          <template x-if="workspaceHistory().length > 4">
            <input type="text" class="history-search" x-model="historySearch" placeholder="筛选项目名称或路径..." />
          </template>

          <div class="history-list">
            <template x-if="filteredHistory().length === 0">
              <div class="empty-hint" style="padding:14px 6px;">暂无项目记录，点击上方「+ 导入项目」并支持自定义名称。</div>
            </template>

            <template x-for="item in filteredHistory()" :key="item.path">
              <div class="workspace-node">
                <div
                  class="history-item"
                  :class="{ active: isCurrentWorkspace(item.path) }"
                  :title="item.path"
                  @click="openWorkspacePath(item.path)"
                >
                  <div class="history-main">
                    <div class="history-name">
                      <span x-show="item.pinned" title="已置顶">★</span>
                      <span x-text="item.name"></span>
                    </div>
                    <div class="history-meta" x-text="historyMeta(item)"></div>
                  </div>
                  <div class="history-ops" @click.stop>
                    <button class="mini-icon-btn" @click="openRenameModal(item)" title="重命名项目">✎</button>
                    <button class="mini-icon-btn" @click="togglePinWorkspace(item)" :title="item.pinned ? '取消置顶' : '置顶项目'">
                      <span x-text="item.pinned ? '★' : '☆'"></span>
                    </button>
                    <button class="mini-icon-btn" @click="requestRemoveWorkspace(item)" title="移除记录">✕</button>
                  </div>
                </div>

                <!-- Codex-style Expanded Tree under Active Project -->
                <template x-if="isCurrentWorkspace(item.path) && workspace.manuscripts.length > 0">
                  <div class="codex-tree">
                    <div class="tree-group-head">
                      <span>论文主稿</span>
                    </div>
                    <template x-for="m in workspace.manuscripts" :key="m.name">
                      <button
                        class="tree-item"
                        :class="{ active: activeManuscript === m.name && activeDocTarget.type === 'main' }"
                        @click="selectMainManuscript(m.name)"
                      >
                        <span class="tree-item-name" x-text="m.name"></span>
                        <span class="role-chip" x-text="m.entry_tex"></span>
                      </button>
                    </template>

                    <div class="tree-group-head">
                      <span>附属文档</span>
                      <button class="tree-add-btn" @click="openCompanionModal()">+ 新建</button>
                    </div>
                    <template x-if="currentCompanions().length === 0">
                      <div style="font-size:11px;color:var(--muted);padding:3px 6px;">暂无 Title Page / Highlights</div>
                    </template>
                    <template x-for="comp in currentCompanions()" :key="comp.name">
                      <button
                        class="tree-item"
                        :class="{ active: activeDocTarget.type === 'companion' && activeDocTarget.name === comp.name }"
                        @click="selectCompanion(comp)"
                        :title="comp.name"
                      >
                        <span class="tree-item-name" x-text="comp.name"></span>
                        <span class="role-chip" x-text="comp.role"></span>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <div class="sidebar-footer">
            <button class="btn btn-soft btn-sm" @click="openDemoWorkspace()">加载示例返修工程</button>
            <button class="btn btn-soft btn-sm" @click="openHelpModal('init')">✨ AI 目录与文档助手</button>
          </div>
        </div>
      </template>

      <!-- Patent Sidebar Expanded -->
      <template x-if="sidebarExpanded && activeWorkbench === 'patent'">
        <div style="display:flex;flex-direction:column;gap:10px;height:100%;min-height:0;">
          <div class="sidebar-top-row">
            <div class="brand-glyph brand-glyph-inline" title="Rebuttal Sidecar">
              <img src="/favicon.svg" alt="" width="22" height="22" />
            </div>
            <button class="btn btn-mint btn-sm" style="flex:1;" @click="openPatentModal()">+ 新建/导入专利</button>
            <button class="mini-icon-btn" @click="toggleSidebar(false)" title="收起侧边栏">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>

          <div class="sidebar-section-label">
            <span>专利项目库</span>
            <span x-text="(patent.patent_history || []).length + ' 项'"></span>
          </div>

          <div class="history-list">
            <template x-if="(patent.patent_history || []).length === 0">
              <div class="empty-hint" style="padding:14px 6px;">暂无专利记录，点击上方「+ 新建/导入专利」开始撰写交底书或跟踪年费。</div>
            </template>

            <template x-for="item in (patent.patent_history || [])" :key="item.path">
              <div class="workspace-node">
                <div
                  class="history-item"
                  :class="{ active: isCurrentPatent(item.path) }"
                  :title="item.path"
                  @click="openPatentPath(item.path)"
                >
                  <div class="history-main">
                    <div class="history-name">
                      <span x-show="item.pinned" title="已置顶">★</span>
                      <span x-text="item.name"></span>
                    </div>
                    <div class="history-meta" x-text="patentTypeLabel(item.patent_type) + ' · ' + patentStageLabel(item.stage)"></div>
                  </div>
                  <div class="history-ops" @click.stop>
                    <button class="mini-icon-btn" @click="togglePinPatent(item)" :title="item.pinned ? '取消置顶' : '置顶'">
                      <span x-text="item.pinned ? '★' : '☆'"></span>
                    </button>
                    <button class="mini-icon-btn" @click="requestRemovePatent(item)" title="移除记录">✕</button>
                  </div>
                </div>

                <!-- Codex-style Tree inside Active Patent -->
                <template x-if="isCurrentPatent(item.path) && patent.patent_dir">
                  <div class="codex-tree">
                    <div class="tree-group-head">
                      <span>撰写与定稿</span>
                      <button class="tree-add-btn" @click="exportPatentDocx()">导出 Word</button>
                    </div>
                    <template x-for="doc in (patent.documents || [])" :key="doc.rel_path">
                      <button
                        class="tree-item"
                        :class="{ active: patentMainTab === 'doc' && patentDocRel === doc.rel_path }"
                        @click="selectPatentDocument(doc.rel_path)"
                        :title="doc.rel_path"
                      >
                        <span class="tree-item-name" x-text="doc.name"></span>
                        <span class="role-chip" x-text="doc.ext.toUpperCase()"></span>
                      </button>
                    </template>

                    <div class="tree-group-head"><span>模块视图</span></div>
                    <button class="tree-item" :class="{ active: patentMainTab === 'figures' }" @click="patentMainTab = 'figures'">
                      <span class="tree-item-name">说明书附图与标号</span>
                      <span class="role-chip" x-text="(patent.figures || []).length + ' 图'"></span>
                    </button>
                    <button class="tree-item" :class="{ active: patentMainTab === 'timeline' }" @click="patentMainTab = 'timeline'">
                      <span class="tree-item-name">生命周期与年费</span>
                      <span class="role-chip" x-text="patent.schedule?.next_days_left !== null && patent.schedule?.next_days_left !== undefined ? (patent.schedule.next_days_left + ' 天') : patentStageLabel(patent.meta?.stage)"></span>
                    </button>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <div class="sidebar-footer">
            <button class="btn btn-soft btn-sm" @click="openDemoPatent()">加载示例专利工程</button>
            <button class="btn btn-soft btn-sm" @click="openHelpModal('patent_init')">✨ AI 专利交底与拆解助手</button>
          </div>
        </div>
      </template>
    </aside>

    <!-- Main Column -->
    <div class="main-column">
      <!-- Top Quick-Access Toolbar -->
      <header class="quick-toolbar">
        <div class="toolbar-cluster">
          <div class="segmented-capsule workbench-switcher" title="切换工作台">
            <button class="seg-btn" :class="{ active: activeWorkbench === 'paper' }" @click="switchWorkbench('paper')">论文返修</button>
            <button class="seg-btn" :class="{ active: activeWorkbench === 'patent' }" @click="switchWorkbench('patent')">专利管理</button>
          </div>

          <template x-if="patentAlerts.length > 0">
            <button class="alert-pill-btn" @click="jumpToPatentAlert(patentAlerts[0])" :title="patentAlerts[0].patent_name + ' · ' + patentAlerts[0].title">
              <span>🔔 专利提醒</span>
              <span class="count-badge" x-text="patentAlerts.length"></span>
            </button>
          </template>

          <!-- Paper Controls (Left) -->
          <template x-if="activeWorkbench === 'paper' && workspace.manuscripts.length > 0">
            <button
              class="btn btn-sm"
              :class="todoCollapsed ? 'btn-soft' : 'btn-indigo'"
              @click="toggleTodoCollapse()"
              title="展开/收起审稿意见看板"
            >
              <span>审稿看板</span>
              <span class="count-badge" x-text="todosVerifiedCount() + '/' + todos.length"></span>
            </button>
          </template>

          <template x-if="activeWorkbench === 'paper' && workspace.manuscripts.length > 0 && activeDocTarget.type === 'companion'">
            <button class="btn btn-soft btn-sm" @click="selectMainManuscript(activeManuscript)">← 返回主稿</button>
          </template>

          <template x-if="activeWorkbench === 'paper' && workspace.manuscripts.length > 0 && activeDocTarget.type === 'main'">
            <select class="pill-select" x-model="activeManuscript" @change="selectMainManuscript(activeManuscript)" title="切换活跃稿件">
              <template x-for="m in workspace.manuscripts" :key="m.name">
                <option :value="m.name" x-text="'稿件: ' + m.name"></option>
              </template>
            </select>
          </template>

          <template x-if="activeWorkbench === 'paper' && activeManuscript && activeDocTarget.type === 'main'">
            <select class="pill-select" x-model="selectedBaselineKey" @change="onBaselineChanged()" title="选择对比基准">
              <option value="">仅 Clean 净版</option>
              <optgroup label="本地归档 (_archive)" x-show="baselines.archive.length > 0">
                <template x-for="b in baselines.archive" :key="'archive:' + b.ref">
                  <option :value="'archive:' + b.ref" x-text="b.label"></option>
                </template>
              </optgroup>
              <optgroup :label="baselineGitGroupLabel()" x-show="baselines.git.length > 0">
                <template x-for="b in baselines.git" :key="'git:' + b.ref + ':' + (b.commit || '')">
                  <option :value="'git:' + b.ref" x-text="b.label"></option>
                </template>
              </optgroup>
              <template x-if="workspace.git_root">
                <optgroup label="更多 Git 历史选项">
                  <option value="__action:toggle_all__" x-text="includeAllGitCommits ? '⇄ 仅显示涉及本稿件的提交' : '⇄ 显示全仓库提交（含非 TeX 提交）'"></option>
                  <option value="__action:custom_ref__">⌕ 输入指定 Commit / 分支 / Tag...</option>
                </optgroup>
              </template>
            </select>
          </template>

          <template x-if="activeWorkbench === 'paper' && activeManuscript">
            <select class="pill-select" x-model="manuscriptEngine" @change="onEngineChanged()" title="LaTeX 编译引擎">
              <option value="auto">Auto 引擎</option>
              <option value="xelatex">XeLaTeX</option>
              <option value="pdflatex">pdfLaTeX</option>
              <option value="lualatex">LuaLaTeX</option>
            </select>
          </template>

          <!-- Patent Controls (Left) -->
          <template x-if="activeWorkbench === 'patent' && patent.patent_dir">
            <button
              class="btn btn-sm"
              :class="patentFeedbackCollapsed ? 'btn-soft' : 'btn-indigo'"
              @click="togglePatentFeedbackCollapse()"
              title="展开/收起代理/审查意见看板"
            >
              <span>代理/OA意见</span>
              <span class="count-badge" x-text="patentResolvedCount() + '/' + (patent.feedback?.items || []).length"></span>
            </button>
          </template>
        </div>

        <template x-if="activeWorkbench === 'paper' && activeManuscript && activeDocTarget.type === 'main'">
          <div class="segmented-capsule">
            <button class="seg-btn" :class="{ active: viewMode === 'diff' }" @click="switchViewMode('diff')">Diff 对比</button>
            <button class="seg-btn" :class="{ active: viewMode === 'clean' }" @click="switchViewMode('clean')">Clean 净版</button>
            <button class="seg-btn" :class="{ active: viewMode === 'split' }" @click="switchViewMode('split')">双栏对照</button>
          </div>
        </template>

        <template x-if="activeWorkbench === 'paper' && activeManuscript && activeDocTarget.type === 'companion'">
          <div class="segmented-capsule">
            <template x-if="activeDocTarget.compilable">
              <button class="seg-btn" :class="{ active: companionViewMode === 'pdf' }" @click="switchCompanionViewMode('pdf')">PDF 预览</button>
            </template>
            <button class="seg-btn" :class="{ active: companionViewMode === 'source' }" @click="switchCompanionViewMode('source')">源码 / 字数检查</button>
          </div>
        </template>

        <template x-if="activeWorkbench === 'patent' && patent.patent_dir">
          <div class="segmented-capsule">
            <button class="seg-btn" :class="{ active: patentMainTab === 'doc' }" @click="patentMainTab = 'doc'">文档预览</button>
            <button class="seg-btn" :class="{ active: patentMainTab === 'diff' }" @click="openPatentDiffTab()">版本 Diff</button>
            <button class="seg-btn" :class="{ active: patentMainTab === 'figures' }" @click="patentMainTab = 'figures'">附图与标号</button>
            <button class="seg-btn" :class="{ active: patentMainTab === 'timeline' }" @click="patentMainTab = 'timeline'">时间轴与年费</button>
          </div>
        </template>

        <div class="toolbar-cluster">
          <!-- Paper Controls (Right) -->
          <template x-if="activeWorkbench === 'paper' && activeManuscript">
            <button class="btn btn-soft btn-sm" @click="openTodoModal()">+ 录入意见</button>
          </template>
          <template x-if="activeWorkbench === 'paper' && activeManuscript">
            <button class="btn btn-soft btn-sm" @click="openExportModal()">导出回复信</button>
          </template>

          <template x-if="activeWorkbench === 'paper'">
            <label class="toggle-pill" :class="{ active: settings.auto_compile }" title="默认关闭，避免频繁自动编译占用资源">
              <input type="checkbox" :checked="settings.auto_compile" @change="toggleAutoCompile($event.target.checked)" />
              <span x-text="settings.auto_compile ? '自动编译: 开' : '自动编译: 关'"></span>
            </label>
          </template>

          <template x-if="activeWorkbench === 'paper'">
            <span class="status-pill" :class="'status-' + statusBadgeClass()">
              <span class="spinner" x-show="isCompiling()"></span>
              <span x-text="statusLabel()"></span>
            </span>
          </template>

          <template x-if="activeWorkbench === 'paper'">
            <button
              class="btn btn-mint btn-sm"
              :disabled="!canCompileCurrentTarget() || isCompiling()"
              @click="triggerCompile()"
            >
              <span class="spinner" x-show="isCompiling()"></span>
              <span x-text="isCompiling() ? '正在编译...' : '立即编译'"></span>
            </button>
          </template>

          <template x-if="activeWorkbench === 'paper'">
            <button class="icon-pill-btn" @click="openCompilerModal()" title="编译器设置与 TeX 安装">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </template>

          <!-- Patent Controls (Right) -->
          <template x-if="activeWorkbench === 'patent' && patent.patent_dir">
            <button class="btn btn-soft btn-sm" @click="openSnapshotModal()">保存快照</button>
          </template>
          <template x-if="activeWorkbench === 'patent' && patent.patent_dir">
            <button class="btn btn-mint btn-sm" :disabled="isExportingDocx" @click="exportPatentDocx()">
              <span x-text="isExportingDocx ? '导出中...' : '导出交底书 Word'"></span>
            </button>
          </template>
          <template x-if="activeWorkbench === 'patent'">
            <button class="icon-pill-btn" @click="openPatentSettings()" title="生命周期与年费提醒服务设置">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </template>

          <button class="btn btn-soft btn-sm" @click="openHelpModal(activeWorkbench === 'patent' ? 'patent_init' : 'init')" title="帮助与 AI 助手提示词">帮助</button>

          <template x-if="isDesktopShell">
            <div class="win-controls no-drag">
              <button class="win-ctrl-btn" @click="minimizeWindow()" title="最小化">
                <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
              <button class="win-ctrl-btn" @click="toggleMaximizeWindow()" :title="isWindowMaximized ? '向下还原' : '最大化'">
                <template x-if="!isWindowMaximized">
                  <svg width="11" height="11" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                </template>
                <template x-if="isWindowMaximized">
                  <svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.8" y="3.5" width="6.5" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 3.5V2.2a.7.7 0 0 1 .7-.7h5.1a.7.7 0 0 1 .7.7v5.1a.7.7 0 0 1-.7.7H8.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
                </template>
              </button>
              <button class="win-ctrl-btn win-ctrl-close" @click="closeWindow()" title="关闭">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
              </button>
            </div>
          </template>
        </div>
      </header>

      <!-- Workspace Stage (Paper Workbench) -->
      <div class="bento-stage" x-show="activeWorkbench === 'paper'">
        <!-- Empty / Zero-Manuscript Landing -->
        <template x-if="!workspace.project_root || workspace.manuscripts.length === 0">
          <main class="empty-workspace">
            <div class="empty-card">
              <div class="empty-hero">
                <h2>选择论文工程开始返修</h2>
                <p>导入科研项目根目录或任意含 <code>main.tex</code> 的论文目录，支持自定义项目名称并永久记忆历史；已编译过的 PDF 会自动读取缓存，无需重复编译。</p>
              </div>
              <template x-if="workspace.project_root && workspace.manuscripts.length === 0">
                <div class="empty-warn">
                  <div>当前目录未发现可编译的 LaTeX 稿件（需在 <code>docs/manuscripts/*/</code>、直接子目录或当前目录包含 <code>\documentclass</code>）：</div>
                  <code x-text="workspace.project_root"></code>
                </div>
              </template>
              <div class="empty-actions">
                <button class="btn btn-indigo" @click="openImportModal()">+ 导入项目文件夹</button>
                <button class="btn btn-mint" @click="openDemoWorkspace()">加载示例返修工程</button>
                <button class="btn btn-soft" @click="openHelpModal('init')">✨ 获取 AI 目录整理提示词</button>
              </div>
              <template x-if="workspaceHistory().length > 0">
                <div class="recent-box">
                  <div class="recent-title">最近导入的项目</div>
                  <template x-for="item in workspaceHistory().slice(0, 5)" :key="item.path">
                    <button class="recent-item" @click="openWorkspacePath(item.path)" x-text="item.name + ' · ' + item.path"></button>
                  </template>
                </div>
              </template>
            </div>
          </main>
        </template>

        <!-- Dual-Pane Bento Workspace -->
        <template x-if="workspace.project_root && workspace.manuscripts.length > 0">
          <main class="bento-grid" :class="{ 'kanban-collapsed': todoCollapsed }">
            <!-- Collapsible Reviewer Kanban Card -->
            <section class="bento-card kanban-card" x-show="!todoCollapsed">
              <div class="kanban-hero">
                <div class="kanban-hero-top">
                  <span class="kanban-hero-title">审稿意见看板</span>
                  <button class="btn btn-white btn-sm" @click="toggleTodoCollapse()" title="收起看板">« 收起</button>
                </div>
                <div class="kanban-metric-row">
                  <div class="kanban-metric" x-text="todoProgressText()"></div>
                  <span class="kanban-pct-badge" x-text="todoProgressPercent() + '% 完成'"></span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" :style="'width:' + todoProgressPercent() + '%'"></div>
                </div>
                <div class="kanban-hero-actions">
                  <button class="btn btn-indigo btn-sm" @click="openTodoModal()">+ 录入意见</button>
                  <div class="ai-trigger-wrap" @mouseenter="openAiTodoPopover()" @mouseleave="scheduleCloseAiTodoPopover()">
                    <button class="btn btn-white btn-sm" @click="openAiTodoPopover(true)">✨ AI 规范导入</button>
                  </div>
                </div>
              </div>

              <!-- Hover-Triggered AI Todo Specification Popover -->
              <div
                class="ai-popover"
                x-show="showAiTodoPopover"
                @mouseenter="cancelCloseAiTodoPopover()"
                @mouseleave="scheduleCloseAiTodoPopover()"
              >
                <div class="ai-popover-head">
                  <strong>让 AI 自动整理并关联论文段落</strong>
                  <button class="btn btn-mint btn-sm" @click="copyAiPrompt(todoInitPrompt(), 'todo')" x-text="aiCopyTag === 'todo' ? '✓ 已复制' : '复制提示词'"></button>
                </div>
                <div class="ai-popover-desc">
                  把这段提示词发给您的 AI 助手，它会规范写入当前稿件的 <code>.rebuttal_todo.json</code>，并自动匹配到对应章节/段落：
                </div>
                <textarea class="ai-prompt-preview" rows="8" readonly :value="todoInitPrompt()"></textarea>
              </div>

              <div class="filter-bar">
                <div class="chip-row">
                  <button class="chip" :class="{ active: reviewerFilter === 'ALL' }" @click="reviewerFilter = 'ALL'">全部</button>
                  <template x-for="rev in reviewers()" :key="rev">
                    <button class="chip" :class="{ active: reviewerFilter === rev }" @click="reviewerFilter = rev" x-text="rev"></button>
                  </template>
                </div>
                <select class="pill-select" style="padding:3px 8px;" x-model="statusFilter">
                  <option value="ALL">全部状态</option>
                  <option value="pending">待修改</option>
                  <option value="agent_done">AI已改待核</option>
                  <option value="verified">已核验</option>
                </select>
              </div>

              <div class="todo-list">
                <template x-if="filteredTodos().length === 0">
                  <div class="empty-hint">
                    暂无审稿意见。<br/>可点击上方「+ 录入意见」手动添加，或将鼠标悬停在「✨ AI 规范导入」复制提示词交由 AI 批量生成。
                  </div>
                </template>
                <template x-for="item in filteredTodos()" :key="item.id">
                  <article class="todo-card" :class="'card-' + item.status">
                    <div class="card-top">
                      <div class="card-meta">
                        <span class="id-badge" x-text="item.id"></span>
                        <span class="rev-tag" x-text="item.reviewer"></span>
                        <template x-if="item.target_location">
                          <button
                            class="loc-tag"
                            @click="jumpToLocation(item.target_location)"
                            title="若包含页码（如 Page 5），点击跳转到 PDF 对应页"
                            x-text="item.target_location"
                          ></button>
                        </template>
                      </div>
                      <button class="state-btn" :class="'state-' + item.status" @click="cycleTodoStatus(item)" x-text="statusText(item.status)"></button>
                    </div>

                    <div class="card-summary" x-text="item.summary"></div>

                    <template x-if="item.response_draft">
                      <div class="card-draft" x-text="item.response_draft"></div>
                    </template>

                    <div class="card-footer">
                      <span x-text="formatTime(item.updated_at)"></span>
                      <div>
                        <button class="link-btn" @click="openTodoModal(item)">编辑</button>
                        <button class="link-btn danger" @click="requestDeleteTodo(item)">删除</button>
                      </div>
                    </div>
                  </article>
                </template>
              </div>
            </section>

            <!-- Right PDF & Companion Viewer Card -->
            <section class="bento-card">
              <div class="compile-progress-bar" x-show="isCompiling()">
                <div class="compile-progress-fill"></div>
              </div>

              <div class="viewer-header">
                <div class="viewer-title-group">
                  <span class="viewer-title" x-text="viewerTitleText()"></span>
                  <span class="viewer-sub" x-text="viewerSubText()"></span>
                </div>

                <div class="viewer-controls" x-show="activeDocTarget.type === 'main' || companionViewMode === 'pdf'">
                  <button class="btn btn-soft btn-sm" @click="stepPage(-1)" :disabled="currentPage <= 1">‹</button>
                  <span class="page-indicator" x-text="totalPages ? (currentPage + ' / ' + totalPages) : '- / -'"></span>
                  <button class="btn btn-soft btn-sm" @click="stepPage(1)" :disabled="currentPage >= totalPages">›</button>
                  <span class="divider"></span>
                  <button class="btn btn-soft btn-sm" @click="adjustZoom(-0.15)">-</button>
                  <span class="zoom-indicator" x-text="Math.round(zoomScale * 100) + '%'"></span>
                  <button class="btn btn-soft btn-sm" @click="adjustZoom(0.15)">+</button>
                  <button class="btn btn-soft btn-sm" @click="resetZoom()">100%</button>
                </div>
              </div>

              <div class="pdf-stage" id="pdf-stage" @scroll.passive="onPdfScroll()">
                <div class="compiling-banner" x-show="isCompiling()">
                  <span class="spinner"></span>
                  <span>正在沙盒中执行 LaTeX 编译，请稍候...</span>
                </div>

                <!-- Main Manuscript PDF Views -->
                <template x-if="activeDocTarget.type === 'main'">
                  <div style="height:100%;">
                    <template x-if="!hasCurrentModePdf()">
                      <div class="pdf-empty">
                        <div>
                          <p x-text="pdfEmptyMessage()"></p>
                          <button class="btn btn-mint" :disabled="!activeManuscript || isCompiling()" @click="triggerCompile()">
                            <span class="spinner" x-show="isCompiling()"></span>
                            <span x-text="isCompiling() ? '正在编译...' : '立即编译预览'"></span>
                          </button>
                        </div>
                      </div>
                    </template>

                    <div class="pdf-canvas-wrap" x-show="viewMode !== 'split' && hasCurrentModePdf()" id="single-pdf-container"></div>
                    <div class="pdf-split-wrap" x-show="viewMode === 'split' && (compileStatus.has_clean || compileStatus.has_diff)">
                      <div class="split-col">
                        <div class="split-col-title">Clean 净版</div>
                        <div id="split-clean-container"></div>
                      </div>
                      <div class="split-col">
                        <div class="split-col-title">Diff 修订版</div>
                        <div id="split-diff-container"></div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Companion File Views (Title Page / Highlights / Cover Letter) -->
                <template x-if="activeDocTarget.type === 'companion'">
                  <div style="height:100%;">
                    <template x-if="companionViewMode === 'pdf'">
                      <div style="height:100%;">
                        <template x-if="!hasCompanionPdf()">
                          <div class="pdf-empty">
                            <div>
                              <p>该附属文档（<code x-text="activeDocTarget.name"></code>）尚未编译为 PDF。</p>
                              <button class="btn btn-mint" :disabled="isCompiling()" @click="triggerCompile()">
                                <span class="spinner" x-show="isCompiling()"></span>
                                <span x-text="isCompiling() ? '正在编译...' : '编译当前附属文档'"></span>
                              </button>
                            </div>
                          </div>
                        </template>
                        <div class="pdf-canvas-wrap" x-show="hasCompanionPdf()" id="companion-pdf-container"></div>
                      </div>
                    </template>

                    <template x-if="companionViewMode === 'source'">
                      <div class="companion-source-view">
                        <template x-if="companionData.bullets && companionData.bullets.length > 0">
                          <div class="bullet-check-card">
                            <div class="toolchain-header">
                              <span>要点字数检查（期刊 Highlights 通常要求每条 ≤ 85 字符）</span>
                              <span class="sub-stat" x-text="'共 ' + companionData.bullets.length + ' 条'"></span>
                            </div>
                            <template x-for="(b, idx) in companionData.bullets" :key="idx">
                              <div class="bullet-row">
                                <span x-text="b.text"></span>
                                <span class="char-badge" :class="b.over_85 ? 'char-over' : 'char-ok'" x-text="b.chars + ' 字符'"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                        <pre class="source-pre" x-text="companionData.content || ''"></pre>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Collapsible LaTeX Error Drawer -->
              <div class="error-drawer" x-show="compileStatus.state === 'error' || showErrorDrawer">
                <div class="error-header" @click="showErrorDrawer = !showErrorDrawer">
                  <span class="error-title" x-text="'编译输出 / 错误诊断 (' + (compileStatus.errors?.length || 0) + ')'"></span>
                  <button class="link-btn" x-text="showErrorDrawer ? '收起' : '展开'"></button>
                </div>
                <div class="error-body" x-show="showErrorDrawer">
                  <template x-for="(err, idx) in (compileStatus.errors || [])" :key="idx">
                    <div class="err-item">
                      <strong x-text="(err.file || 'LaTeX') + (err.line ? (':' + err.line) : '')"></strong>
                      <span x-text="err.message"></span>
                    </div>
                  </template>
                  <template x-if="compileStatus.log_tail">
                    <pre class="log-tail" x-text="compileStatus.log_tail"></pre>
                  </template>
                </div>
              </div>
            </section>
          </main>
        </template>
      </div>

      <!-- Patent Management Stage -->
      <div class="bento-stage" x-show="activeWorkbench === 'patent'">
        <template x-if="!patent.patent_dir">
          <main class="empty-workspace">
            <div class="empty-card">
              <div class="empty-hero">
                <h2>专利撰写、版本管理与年费守护</h2>
                <p>支持 Markdown 交底书与 AI 协作撰写、标准中文专利 Word (<code>.docx</code>) 一键生成、代理商修订痕迹/批注解析、附图标号一致性检查、无感本地版本快照，以及国家知识产权局年费自动推算与开机提醒。</p>
              </div>
              <div class="empty-actions">
                <button class="btn btn-indigo" @click="openPatentModal()">+ 新建或导入专利项目</button>
                <button class="btn btn-mint" @click="openDemoPatent()">加载示例专利工程</button>
                <button class="btn btn-soft" @click="openHelpModal('patent_init')">✨ AI 交底书提示词</button>
              </div>
              <template x-if="(patent.patent_history || []).length > 0">
                <div class="recent-box">
                  <div class="recent-title">最近处理的专利</div>
                  <template x-for="item in (patent.patent_history || []).slice(0, 5)" :key="item.path">
                    <button class="recent-item" @click="openPatentPath(item.path)" x-text="item.name + ' · ' + item.path"></button>
                  </template>
                </div>
              </template>
            </div>
          </main>
        </template>

        <template x-if="patent.patent_dir">
          <main class="bento-grid" :class="{ 'kanban-collapsed': patentFeedbackCollapsed }">
            <!-- Left Collapsible Fuzzy Feedback Panel -->
            <section class="bento-card kanban-card" x-show="!patentFeedbackCollapsed">
              <div class="kanban-hero">
                <div class="kanban-hero-top">
                  <span class="kanban-hero-title">代理 / 审查模糊意见</span>
                  <button class="btn btn-white btn-sm" @click="togglePatentFeedbackCollapse()">« 收起</button>
                </div>
                <div class="kanban-metric-row">
                  <div class="kanban-metric" x-text="patentResolvedCount() + ' / ' + (patent.feedback?.items || []).length + ' 已闭环'"></div>
                  <span class="kanban-pct-badge" x-text="patentFeedbackPct() + '% 完成'"></span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" :style="'width:' + patentFeedbackPct() + '%'"></div>
                </div>
                <div class="kanban-hero-actions">
                  <button class="btn btn-indigo btn-sm" @click="openRawFeedbackModal()">+ 粘贴模糊原件</button>
                  <div class="ai-trigger-wrap" @mouseenter="openAiPatentPopover()" @mouseleave="scheduleCloseAiPatentPopover()">
                    <button class="btn btn-white btn-sm" @click="openAiPatentPopover(true)">✨ AI 拆解</button>
                  </div>
                </div>
              </div>

              <!-- Hover AI Fuzzy Feedback Disentangler Popover -->
              <div
                class="ai-popover"
                x-show="showAiPatentPopover"
                @mouseenter="cancelCloseAiPatentPopover()"
                @mouseleave="scheduleCloseAiPatentPopover()"
              >
                <div class="ai-popover-head">
                  <strong>让 AI 拆解代理/审查员模糊意见</strong>
                  <button class="btn btn-mint btn-sm" @click="copyAiPrompt(patentFeedbackPrompt(), 'pat_fb')" x-text="aiCopyTag === 'pat_fb' ? '✓ 已复制' : '复制提示词'"></button>
                </div>
                <div class="ai-popover-desc">
                  专利代理师或审查员的意见往往偏口语/模糊，复制此提示词连同微信记录或 OA 文本发给 AI，会自动写入 <code>.patent_feedback.json</code> 并列出待确认问题：
                </div>
                <textarea class="ai-prompt-preview" rows="8" readonly :value="patentFeedbackPrompt()"></textarea>
              </div>

              <div class="filter-bar">
                <div class="chip-row">
                  <button class="chip" :class="{ active: patentSourceFilter === 'ALL' }" @click="patentSourceFilter = 'ALL'">全部</button>
                  <button class="chip" :class="{ active: patentSourceFilter === 'agent' }" @click="patentSourceFilter = 'agent'">代理师</button>
                  <button class="chip" :class="{ active: patentSourceFilter === 'examiner' }" @click="patentSourceFilter = 'examiner'">审查员</button>
                  <button class="chip" :class="{ active: patentSourceFilter === 'need_confirm' }" @click="patentSourceFilter = 'need_confirm'">待确认</button>
                </div>
                <div style="display:flex;gap:5px;align-items:center;">
                  <button class="btn btn-soft btn-sm" @click="openFeedbackItemModal()" title="手动新增一条意见">+ 手动</button>
                  <button class="btn btn-soft btn-sm" @click="exportPatentReplySheet()" title="导出代理沟通确认单 / OA 回复草稿">确认单</button>
                </div>
              </div>

              <template x-if="(patent.feedback?.raw_batches || []).length > 0">
                <div class="raw-inbox-bar">
                  <span x-text="'原始收件箱 (' + patent.feedback.raw_batches.length + ' 条模糊记录)'"></span>
                  <button class="link-btn" @click="showRawInbox = !showRawInbox" x-text="showRawInbox ? '收起' : '查看原文'"></button>
                </div>
              </template>
              <div class="raw-inbox-list" x-show="showRawInbox && (patent.feedback?.raw_batches || []).length > 0">
                <template x-for="b in (patent.feedback?.raw_batches || [])" :key="b.id">
                  <div class="raw-batch-card">
                    <div class="raw-batch-head">
                      <strong x-text="b.source_label"></strong>
                      <span x-text="formatTime(b.created_at)"></span>
                    </div>
                    <div class="raw-batch-body" x-text="b.raw_text"></div>
                  </div>
                </template>
              </div>

              <div class="todo-list">
                <template x-if="filteredPatentFeedback().length === 0">
                  <div class="empty-hint">
                    暂无结构化意见。<br/>可点击「+ 粘贴模糊原件」、在 Word 预览中「导入批注」，或用「✨ AI 拆解」整理微信/邮件反馈。
                  </div>
                </template>
                <template x-for="item in filteredPatentFeedback()" :key="item.id">
                  <article class="todo-card" :class="'card-' + patentCardClass(item.status)">
                    <div class="card-top">
                      <div class="card-meta">
                        <span class="id-badge" x-text="item.id"></span>
                        <span class="rev-tag" x-text="patentSourceLabel(item.source)"></span>
                        <template x-if="item.target_section">
                          <span class="loc-tag" x-text="item.target_section"></span>
                        </template>
                      </div>
                      <button class="state-btn" :class="'state-' + patentCardClass(item.status)" @click="cyclePatentFeedbackStatus(item)" x-text="patentStatusText(item.status)"></button>
                    </div>

                    <template x-if="item.original_fuzzy_note">
                      <div class="fuzzy-quote" x-text="'原话: ' + item.original_fuzzy_note"></div>
                    </template>
                    <div class="card-summary" x-text="item.action_plan"></div>
                    <template x-if="item.clarification_question">
                      <div class="clarify-box" x-text="'❓ 待向代理/审查员确认: ' + item.clarification_question"></div>
                    </template>
                    <template x-if="item.reply_draft">
                      <div class="card-draft" x-text="item.reply_draft"></div>
                    </template>

                    <div class="card-footer">
                      <span x-text="formatTime(item.updated_at)"></span>
                      <div>
                        <button class="link-btn" @click="openFeedbackItemModal(item)">编辑</button>
                        <button class="link-btn danger" @click="requestDeleteFeedbackItem(item)">删除</button>
                      </div>
                    </div>
                  </article>
                </template>
              </div>
            </section>

            <!-- Right Patent Main Stage Card -->
            <section class="bento-card">
              <!-- Tab 1: Document Preview & Markdown Editor -->
              <template x-if="patentMainTab === 'doc'">
                <div class="patent-pane">
                  <div class="viewer-header">
                    <div class="viewer-title-group">
                      <span class="viewer-title" x-text="patentDocRel || '未选择文档'"></span>
                      <span class="viewer-sub" x-text="patentDoc.has_redlines ? '含 Word 修订痕迹与批注高亮' : '支持与 AI 协同编辑交底书并一键导出 .docx'"></span>
                    </div>
                    <div class="viewer-controls">
                      <select class="pill-select" x-model="patentDocRev" @change="loadPatentDocument()">
                        <option value="">当前工作区</option>
                        <template x-for="s in (patent.snapshots || [])" :key="s.commit">
                          <option :value="s.ref" x-text="'快照: ' + s.label"></option>
                        </template>
                      </select>
                      <template x-if="patentDoc.ext === 'docx' && !patentDocRev && (patentDoc.comments || []).length > 0">
                        <button class="btn btn-mint btn-sm" @click="importDocxComments()" x-text="'导入 ' + patentDoc.comments.length + ' 条批注到看板'"></button>
                      </template>
                      <template x-if="patentDoc.ext === 'md' && !patentDocRev">
                        <button class="btn btn-sm" :class="patentEditingMd ? 'btn-indigo' : 'btn-soft'" @click="togglePatentMdEdit()" x-text="patentEditingMd ? '返回阅读视图' : '快捷编辑 Markdown'"></button>
                      </template>
                      <template x-if="patentEditingMd">
                        <button class="btn btn-mint btn-sm" @click="savePatentMarkdown()">保存修改</button>
                      </template>
                    </div>
                  </div>

                  <div class="patent-scroll-area">
                    <template x-if="patentEditingMd">
                      <textarea class="md-editor-area" x-model="patentMdDraft" spellcheck="false"></textarea>
                    </template>

                    <template x-if="!patentEditingMd">
                      <div class="doc-reader">
                        <template x-if="(patentDoc.comments || []).length > 0">
                          <div class="comments-banner">
                            <strong>文档批注摘要 (<span x-text="patentDoc.comments.length"></span>)：</strong>
                            <template x-for="c in patentDoc.comments" :key="c.id">
                              <div class="comment-pill-item">
                                <span class="comment-author" x-text="c.author + ':'"></span>
                                <span x-text="c.text"></span>
                                <template x-if="c.anchor_text">
                                  <span class="comment-anchor" x-text="'「' + c.anchor_text + '」'"></span>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>

                        <template x-for="(blk, idx) in (patentDoc.blocks || [])" :key="idx">
                          <div class="doc-block" :class="'doc-' + blk.type + (blk.level ? (' doc-h' + blk.level) : '')">
                            <template x-if="blk.type === 'table'">
                              <table class="doc-table">
                                <template x-for="(row, ridx) in blk.rows" :key="ridx">
                                  <tr>
                                    <template x-for="(cell, cidx) in row" :key="cidx">
                                      <td :class="{ 'doc-th': ridx === 0 }" x-text="cell"></td>
                                    </template>
                                  </tr>
                                </template>
                              </table>
                            </template>
                            <template x-if="blk.type === 'image' && blk.path">
                              <div class="doc-inline-figure">
                                <img :src="'/api/patents/figures/' + encodeURIComponent(blk.path.split('/').pop()) + '?t=' + Date.now()" :alt="blk.alt" />
                                <div class="doc-fig-cap" x-text="blk.alt"></div>
                              </div>
                            </template>
                            <template x-if="blk.type !== 'table' && !(blk.type === 'image' && blk.path)">
                              <div>
                                <template x-for="(seg, sidx) in (blk.segments || [])" :key="sidx">
                                  <span
                                    :class="seg.kind === 'ins' ? 'rev-ins' : (seg.kind === 'del' ? 'rev-del' : '')"
                                    :title="seg.author ? (seg.author + ' ' + (seg.date || '')) : ''"
                                    x-text="seg.text"
                                  ></span>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Tab 2: Cross-Version / File Diff -->
              <template x-if="patentMainTab === 'diff'">
                <div class="patent-pane">
                  <div class="viewer-header">
                    <div class="viewer-title-group">
                      <span class="viewer-title">跨版本 / 跨格式差异对比</span>
                      <span class="viewer-sub">支持比对任意本地历史快照与当前 Markdown / Word 交底书</span>
                    </div>
                    <div class="viewer-controls">
                      <select class="pill-select" x-model="patentDiffForm.left_rel">
                        <template x-for="doc in (patent.documents || [])" :key="'l:' + doc.rel_path">
                          <option :value="doc.rel_path" x-text="'旧版: ' + doc.name"></option>
                        </template>
                      </select>
                      <select class="pill-select" x-model="patentDiffForm.left_rev">
                        <option value="">工作区</option>
                        <template x-for="s in (patent.snapshots || [])" :key="'lr:' + s.commit">
                          <option :value="s.ref" x-text="s.label"></option>
                        </template>
                      </select>
                      <span style="font-size:12px;color:var(--muted);">→</span>
                      <select class="pill-select" x-model="patentDiffForm.right_rel">
                        <template x-for="doc in (patent.documents || [])" :key="'r:' + doc.rel_path">
                          <option :value="doc.rel_path" x-text="'新版: ' + doc.name"></option>
                        </template>
                      </select>
                      <select class="pill-select" x-model="patentDiffForm.right_rev">
                        <option value="">工作区</option>
                        <template x-for="s in (patent.snapshots || [])" :key="'rr:' + s.commit">
                          <option :value="s.ref" x-text="s.label"></option>
                        </template>
                      </select>
                      <button class="btn btn-indigo btn-sm" @click="runPatentDiff()">对比</button>
                    </div>
                  </div>
                  <div class="patent-scroll-area">
                    <div class="diff-summary-bar" x-show="patentDiffResult.summary">
                      <span class="diff-stat-add" x-text="'+ 新增 ' + (patentDiffResult.summary?.added || 0) + ' 段'"></span>
                      <span class="diff-stat-del" x-text="'- 删除 ' + (patentDiffResult.summary?.deleted || 0) + ' 段'"></span>
                      <span class="diff-stat-chg" x-text="'~ 修改 ' + (patentDiffResult.summary?.changed || 0) + ' 段'"></span>
                    </div>
                    <div class="doc-reader">
                      <template x-for="(blk, idx) in (patentDiffResult.blocks || [])" :key="idx">
                        <div class="diff-block-row" :class="'diff-op-' + blk.op">
                          <template x-for="(tok, tidx) in (blk.tokens || [])" :key="tidx">
                            <span :class="tok.kind === 'insert' ? 'rev-ins' : (tok.kind === 'delete' ? 'rev-del' : '')" x-text="tok.text"></span>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Tab 3: Figures & Reference Numerals -->
              <template x-if="patentMainTab === 'figures'">
                <div class="patent-pane">
                  <div class="viewer-header">
                    <div class="viewer-title-group">
                      <span class="viewer-title">说明书附图与附图标记管理</span>
                      <span class="viewer-sub">自动校验附图标记（如 101-模块名）在交底书正文中的出现与一致性</span>
                    </div>
                    <div class="viewer-controls">
                      <button class="btn btn-mint btn-sm" @click="importPatentFigure()">+ 导入附图文件</button>
                      <button class="btn btn-soft btn-sm" @click="refreshNumeralCheck()">刷新标号核查</button>
                    </div>
                  </div>
                  <div class="patent-scroll-area">
                    <div class="figures-grid">
                      <template x-for="fig in (patent.figures || [])" :key="fig.filename">
                        <div class="fig-card">
                          <div class="fig-thumb" @click="lightboxFigureUrl = '/api/patents/figures/' + encodeURIComponent(fig.filename)">
                            <img :src="'/api/patents/figures/' + encodeURIComponent(fig.filename) + '?t=' + Date.now()" :alt="fig.caption" />
                          </div>
                          <div class="fig-meta">
                            <div class="fig-head-row">
                              <strong x-text="'图' + fig.fig_no"></strong>
                              <span x-text="fig.filename"></span>
                            </div>
                            <input type="text" class="fig-caption-input" :value="fig.caption" @change="updateFigureCaption(fig.filename, $event.target.value)" />
                            <div class="fig-actions">
                              <button class="btn btn-soft btn-sm" @click="copyFigureMdSnippet(fig)">复制 MD 引用</button>
                              <button class="btn btn-soft btn-sm" @click="lightboxFigureUrl = '/api/patents/figures/' + encodeURIComponent(fig.filename)">放大查看</button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div class="numeral-panel">
                      <div class="toolchain-header">
                        <span>附图标记字典与正文一致性核查</span>
                        <button class="btn btn-indigo btn-sm" @click="addReferenceNumeral()">+ 添加标号</button>
                      </div>
                      <template x-if="(patent.numeral_check?.undeclared || []).length > 0">
                        <div class="undeclared-warn">
                          正文中检测到未登记在字典中的标号：<strong x-text="patent.numeral_check.undeclared.join(', ')"></strong>
                        </div>
                      </template>
                      <div class="numeral-list">
                        <template x-for="(item, idx) in (patentMetaForm.reference_numerals || [])" :key="idx">
                          <div class="numeral-row">
                            <input type="text" style="width:90px;" x-model="item.code" placeholder="101" />
                            <input type="text" style="flex:1;" x-model="item.name" placeholder="对应部件或模块名称" />
                            <span class="char-badge" :class="numeralStatusClass(item.code)" x-text="numeralStatusText(item.code)"></span>
                            <button class="mini-icon-btn" @click="removeReferenceNumeral(idx)">✕</button>
                          </div>
                        </template>
                      </div>
                      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                        <button class="btn btn-mint btn-sm" @click="savePatentMeta()">保存标号字典并重新核查</button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Tab 4: Lifecycle Timeline, CNIPA Annual Fees & Windows Reminders -->
              <template x-if="patentMainTab === 'timeline'">
                <div class="patent-pane">
                  <div class="viewer-header">
                    <div class="viewer-title-group">
                      <span class="viewer-title">专利生命周期、年费推算与桌面定时提醒</span>
                      <span class="viewer-sub" x-text="patent.schedule?.protection_end_date ? ('保护期届满日: ' + patent.schedule.protection_end_date) : '填写申请日与授权日后自动推算 CNIPA 年费节点'"></span>
                    </div>
                    <div class="viewer-controls">
                      <button class="btn btn-soft btn-sm" @click="testPatentReminder(false)">测试桌面气泡提醒</button>
                      <button class="btn btn-indigo btn-sm" @click="savePatentMeta()">保存专利信息</button>
                    </div>
                  </div>

                  <div class="patent-scroll-area">
                    <div class="stage-stepper">
                      <template x-for="st in patentStages" :key="st.key">
                        <button
                          class="stage-pill"
                          :class="{ active: patentMetaForm.stage === st.key }"
                          @click="patentMetaForm.stage = st.key"
                          x-text="st.label"
                        ></button>
                      </template>
                    </div>

                    <div class="meta-card-box">
                      <div class="form-grid">
                        <div class="form-field form-full">
                          <label>专利名称</label>
                          <input type="text" x-model="patentMetaForm.title" />
                        </div>
                        <div class="form-field">
                          <label>专利类型</label>
                          <select x-model="patentMetaForm.patent_type">
                            <option value="invention">发明专利（20年）</option>
                            <option value="utility_model">实用新型（10年）</option>
                            <option value="design">外观设计（15年）</option>
                          </select>
                        </div>
                        <div class="form-field">
                          <label>CNIPA 费减比例</label>
                          <select x-model.number="patentMetaForm.fee_reduction">
                            <option :value="0">无费减 (全额 100%)</option>
                            <option :value="70">减缴 70%（实缴 30%）</option>
                            <option :value="85">减缴 85%（单人/个人 实缴 15%）</option>
                          </select>
                        </div>
                        <div class="form-field">
                          <label>申请日 (起算年费周年)</label>
                          <input type="date" x-model="patentMetaForm.filing_date" />
                        </div>
                        <div class="form-field">
                          <label>授权公告日</label>
                          <input type="date" x-model="patentMetaForm.grant_date" />
                        </div>
                        <div class="form-field">
                          <label>申请号 / 专利号</label>
                          <input type="text" x-model="patentMetaForm.application_no" placeholder="CN2025..." />
                        </div>
                        <div class="form-field">
                          <label>专利代理机构 / 代理师</label>
                          <input type="text" x-model="patentMetaForm.agency" placeholder="事务所及对接人" />
                        </div>
                      </div>
                    </div>

                    <div class="meta-card-box">
                      <div class="toolchain-header">
                        <span>年费缴费时间表与滞纳预警（按申请日周年推算）</span>
                        <span class="sub-stat" x-text="patent.schedule?.current_year_index ? ('当前处于第 ' + patent.schedule.current_year_index + ' 年度') : '未填写申请日'"></span>
                      </div>
                      <template x-if="(patent.schedule?.fee_schedule || []).length === 0">
                        <div class="empty-hint" style="padding:10px;">填写「申请日」并将状态设为「授权维持」或填入「授权日」后，系统自动推算各年度 CNIPA 年费与滞纳截止期。</div>
                      </template>
                      <div class="fee-list">
                        <template x-for="row in (patent.schedule?.fee_schedule || [])" :key="row.year">
                          <div class="fee-row" :class="'fee-' + row.severity">
                            <div>
                              <strong x-text="'第 ' + row.year + ' 年度'"></strong>
                              <span class="fee-date" x-text="'到期: ' + row.due_date + '（滞纳截止: ' + row.grace_end_date + '）'"></span>
                            </div>
                            <div class="fee-right">
                              <span class="fee-amount" x-text="'参考 ¥' + row.estimated_fee"></span>
                              <span class="char-badge" :class="row.paid ? 'char-ok' : (row.days_left <= 7 ? 'char-over' : '')" x-text="row.paid ? ('已缴 ' + row.paid_at) : (row.days_left < 0 ? ('已逾期 ' + (-row.days_left) + ' 天') : ('剩 ' + row.days_left + ' 天'))"></span>
                              <template x-if="!row.paid">
                                <button class="btn btn-mint btn-sm" @click="markPatentFeePaid(row)">登记已缴</button>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>

                    <div class="meta-card-box">
                      <div class="toolchain-header">
                        <span>自定义节点提醒（如 OA 答复 / 代理商补正截止日）</span>
                        <button class="btn btn-soft btn-sm" @click="addCustomDeadline()">+ 添加节点</button>
                      </div>
                      <template x-for="(dl, idx) in (patentMetaForm.custom_deadlines || [])" :key="dl.id || idx">
                        <div class="numeral-row">
                          <input type="checkbox" x-model="dl.done" title="标记完成" />
                          <input type="text" style="flex:1;" x-model="dl.title" placeholder="节点事项说明" />
                          <input type="date" x-model="dl.due_date" />
                          <button class="mini-icon-btn" @click="removeCustomDeadline(idx)">✕</button>
                        </div>
                      </template>
                    </div>

                    <div class="meta-card-box">
                      <div class="toolchain-header">
                        <span>Windows 每日自动提醒服务（免常驻后台，到期弹系统通知）</span>
                        <label class="toggle-pill" :class="{ active: reminderForm.task_registered }">
                          <input type="checkbox" :checked="reminderForm.task_registered" @change="toggleWindowsReminderTask($event.target.checked)" />
                          <span x-text="reminderForm.task_registered ? '计划任务: 已开启' : '计划任务: 未开启'"></span>
                        </label>
                      </div>
                      <div class="form-grid">
                        <div class="form-field">
                          <label>提前预警天数</label>
                          <input type="number" min="1" max="180" x-model.number="reminderForm.advance_days" />
                        </div>
                        <div class="form-field">
                          <label>每日提醒时间 (HH:MM)</label>
                          <input type="text" x-model="reminderForm.daily_time" placeholder="09:30" />
                        </div>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <button class="link-btn" @click="showSmtpConfig = !showSmtpConfig" x-text="showSmtpConfig ? '收起可选 SMTP 邮件配置 ▲' : '展开可选 SMTP 邮件提醒配置（后期扩展） ▼'"></button>
                        <button class="btn btn-soft btn-sm" @click="saveReminderSettings()">保存提醒配置</button>
                      </div>
                      <div class="form-grid" style="margin-top:8px;" x-show="showSmtpConfig">
                        <label class="checkbox-label form-full">
                          <input type="checkbox" x-model="reminderForm.smtp.enabled" />
                          <span>启用 SMTP 邮件附加通知</span>
                        </label>
                        <div class="form-field">
                          <label>SMTP 主机</label>
                          <input type="text" x-model="reminderForm.smtp.host" placeholder="smtp.qq.com" />
                        </div>
                        <div class="form-field">
                          <label>端口 (SSL 465)</label>
                          <input type="number" x-model.number="reminderForm.smtp.port" />
                        </div>
                        <div class="form-field">
                          <label>发件邮箱</label>
                          <input type="text" x-model="reminderForm.smtp.username" />
                        </div>
                        <div class="form-field">
                          <label>授权码</label>
                          <input type="password" x-model="reminderForm.smtp.password" />
                        </div>
                        <div class="form-field form-full">
                          <label>收件邮箱</label>
                          <div class="input-row">
                            <input type="text" x-model="reminderForm.smtp.to_email" />
                            <button class="btn btn-soft btn-sm" @click="testPatentReminder(true)">发送测试邮件</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </section>
          </main>
        </template>
      </div>
    </div>
  </div>

  <!-- Codex-Style Import Project Modal (with Custom Project Name) -->
  <div class="modal-backdrop" x-show="showWorkspaceModal" @click.self="showWorkspaceModal = false">
    <div class="modal">
      <div class="modal-header">
        <h3>导入科研项目 / 论文目录</h3>
        <button class="link-btn" @click="showWorkspaceModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field form-full">
            <label>工程目录路径（含 <code>docs/manuscripts/</code> 或直接含 <code>main.tex</code>）</label>
            <div class="input-row">
              <input type="text" x-model="workspaceInputPath" placeholder="E:\Research\MyPaper" @input="syncSuggestedName()" @keydown.enter="confirmImportWorkspace()" />
              <button class="btn btn-soft btn-sm" @click="pickImportFolder()">选择目录</button>
            </div>
          </div>
          <div class="form-field form-full">
            <label>自定义项目显示名称（可在历史侧边栏随时重命名）</label>
            <input type="text" x-model="workspaceCustomName" placeholder="例如 IEEE VR 2026 返修（留空默认取文件夹名）" @keydown.enter="confirmImportWorkspace()" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showWorkspaceModal = false">取消</button>
        <button class="btn btn-indigo" @click="confirmImportWorkspace()">确认导入</button>
      </div>
    </div>
  </div>

  <!-- Rename Project Modal -->
  <div class="modal-backdrop" x-show="showRenameModal" @click.self="showRenameModal = false">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>重命名项目</h3>
        <button class="link-btn" @click="showRenameModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>项目显示名称</label>
          <input type="text" x-model="renameTarget.name" @keydown.enter="confirmRenameWorkspace()" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showRenameModal = false">取消</button>
        <button class="btn btn-indigo" @click="confirmRenameWorkspace()">保存</button>
      </div>
    </div>
  </div>

  <!-- Create Companion Document Modal (Title Page / Highlights / Cover Letter) -->
  <div class="modal-backdrop" x-show="showCompanionModal" @click.self="showCompanionModal = false">
    <div class="modal">
      <div class="modal-header">
        <h3>新建非正文附属文档</h3>
        <button class="link-btn" @click="showCompanionModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field form-full">
            <label>文档类型模板</label>
            <select x-model="companionForm.template" @change="onCompanionTemplateChange()">
              <option value="title_page">Title Page (盲审作者页 + 致谢 + CRediT)</option>
              <option value="highlights">Highlights (投稿亮点，内置 ≤85 字符检测)</option>
              <option value="cover_letter">Cover Letter (投稿/返修致编辑信)</option>
              <option value="declaration">Declaration of Competing Interest (利益冲突声明)</option>
            </select>
          </div>
          <div class="form-field form-full">
            <label>文件名（将生成在当前稿件目录下）</label>
            <input type="text" x-model="companionForm.filename" placeholder="title_page.tex" />
          </div>
        </div>
      </div>
