  <!-- Compiler & TeX Installer Modal -->
  <div class="modal-backdrop" x-show="showCompilerModal" @click.self="showCompilerModal = false">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>LaTeX 编译器配置与发行版安装</h3>
        <button class="link-btn" @click="showCompilerModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="segmented-capsule" style="margin-bottom: 12px;">
          <button class="seg-btn" :class="{ active: compilerTab === 'config' }" @click="compilerTab = 'config'">编译器与路径配置</button>
          <button class="seg-btn" :class="{ active: compilerTab === 'install' }" @click="openTexInstallTab()">内置安装 MiKTeX / TeX Live</button>
        </div>

        <template x-if="compilerTab === 'config'">
          <div>
            <div class="form-grid">
              <div class="form-field form-full">
                <label>自定义 TeX bin 目录（留空自动探测系统 PATH 与本机安装路径）</label>
                <div class="input-row">
                  <input type="text" x-model="compilerForm.tex_bin_dir" placeholder="例如 E:\MiKTeX\miktex\bin\x64 或 C:\texlive\2025\bin\windows" />
                  <button class="btn btn-soft btn-sm" @click="scanLocalTex(true)">自动扫描</button>
                  <button class="btn btn-soft btn-sm" @click="browseCompilerDir('tex_bin_dir')">浏览</button>
                </div>
                <template x-if="discoveredTexDirs.length > 0">
                  <div class="chip-row" style="margin-top:4px;">
                    <template x-for="inst in discoveredTexDirs" :key="inst.bin_dir">
                      <button
                        type="button"
                        class="chip"
                        :class="{ active: compilerForm.tex_bin_dir === inst.bin_dir }"
                        @click="selectDiscoveredTex(inst)"
                        x-text="inst.distro + ': ' + inst.bin_dir"
                      ></button>
                    </template>
                  </div>
                </template>
              </div>

              <div class="form-field form-full">
                <label>自定义 Perl 路径（用于 latexdiff / latexmk，留空自动探测 Git 内置 Perl）</label>
                <div class="input-row">
                  <input type="text" x-model="compilerForm.perl_path" placeholder="例如 E:\Git\usr\bin\perl.exe" />
                  <button class="btn btn-soft btn-sm" @click="browseCompilerDir('perl_path')">浏览</button>
                </div>
              </div>

              <div class="form-field">
                <label>全局默认引擎</label>
                <select x-model="compilerForm.default_engine">
                  <option value="auto">Auto (自动检测 ctex/fontspec)</option>
                  <option value="xelatex">XeLaTeX</option>
                  <option value="pdflatex">pdfLaTeX</option>
                  <option value="lualatex">LuaLaTeX</option>
                </select>
              </div>

              <div class="form-field">
                <label>构建配方 (Recipe)</label>
                <select x-model="compilerForm.recipe">
                  <option value="auto">Auto (优先 latexmk，否则引擎+文献)</option>
                  <option value="latexmk">latexmk</option>
                  <option value="engine_bibtex">Engine + BibTeX</option>
                  <option value="engine_biber">Engine + Biber</option>
                  <option value="engine_only">仅 Engine 快速编译</option>
                </select>
              </div>

              <div class="form-field">
                <label>附加编译参数 (Extra Args)</label>
                <input type="text" x-model="compilerForm.extra_args" placeholder="例如 -shell-escape" />
              </div>

              <div class="form-field">
                <label>单次编译超时 (秒)</label>
                <input type="number" min="30" max="900" x-model.number="compilerForm.compile_timeout" />
              </div>

              <div class="form-field">
                <label>自动编译防抖延迟 (ms)</label>
                <input type="number" min="200" max="10000" step="100" x-model.number="compilerForm.debounce_ms" />
              </div>

              <div class="form-field checkbox-col">
                <label class="checkbox-label">
                  <input type="checkbox" x-model="compilerForm.auto_compile" />
                  <span>开启文件保存自动编译（默认关闭）</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" x-model="compilerForm.miktex_auto_install" />
                  <span>允许 MiKTeX 自动安装缺失宏包</span>
                </label>
              </div>
            </div>

            <div class="toolchain-box">
              <div class="toolchain-header">
                <span>工具链状态探测</span>
                <button class="btn btn-sm btn-soft" @click="probeToolchain()">重新检测</button>
              </div>
              <div class="toolchain-grid">
                <template x-for="(info, name) in toolchain" :key="name">
                  <div class="tool-row">
                    <span class="tool-dot" :class="info.available ? 'ok' : 'missing'"></span>
                    <strong x-text="name"></strong>
                    <span class="tool-path" x-text="info.note ? (info.note + (info.path ? ' · ' + info.path : '')) : (info.path || '未检测到')"></span>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <template x-if="compilerTab === 'install'">
          <div class="installer-stack">
            <div class="installer-card">
              <div class="installer-head">
                <div>
                  <strong>MiKTeX（轻量按需下载 · 推荐快速上手）</strong>
                  <div class="installer-desc">通过 Windows winget 一键部署 MiKTeX，并可预装返修 Diff 与顶会/期刊常用宏包。</div>
                </div>
                <div class="installer-actions">
                  <button class="btn btn-mint btn-sm" :disabled="texInstallStatus.state === 'running'" @click="runTexInstall('install_miktex')">一键安装 MiKTeX</button>
                  <button class="btn btn-soft btn-sm" :disabled="texInstallStatus.state === 'running'" @click="runTexInstall('install_miktex_packages')">补全返修常用宏包</button>
                </div>
              </div>
              <div class="installer-tags">包含: latexmk · latexdiff · ulem · xcolor · epstopdf-pkg · grfext · booktabs · cite · IEEEtran · elsarticle</div>
            </div>

            <div class="installer-card">
              <div class="installer-head">
                <div>
                  <strong>TeX Live（完整学术发行版 · 内置国内高速镜像）</strong>
                  <div class="installer-desc">从选定的 CTAN 镜像下载官方安装器，支持打开图形安装向导或全自动静默安装（scheme-medium）。</div>
                </div>
              </div>
              <div class="form-grid" style="margin-top:8px;">
                <div class="form-field">
                  <label>CTAN 下载镜像源</label>
                  <select x-model="texLiveForm.mirror">
                    <template x-for="(m, key) in texMirrors" :key="key">
                      <option :value="key" x-text="m.label"></option>
                    </template>
                  </select>
                </div>
                <div class="form-field">
                  <label>安装模式</label>
                  <select x-model="texLiveForm.mode">
                    <option value="gui">启动官方图形安装向导（推荐）</option>
                    <option value="unattended">后台自动安装中等方案 (scheme-medium)</option>
                  </select>
                </div>
              </div>
              <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
                <button class="btn btn-soft btn-sm" @click="scanLocalTex(true)">安装后自动扫描绑定</button>
                <button class="btn btn-indigo btn-sm" :disabled="texInstallStatus.state === 'running'" @click="runTexInstall('install_texlive', texLiveForm)">下载并安装 TeX Live</button>
              </div>
            </div>

            <div class="installer-console-box">
              <div class="toolchain-header">
                <span>
                  安装进度：
                  <strong x-text="texInstallStatus.progress || texInstallStatus.message || '就绪'"></strong>
                </span>
                <template x-if="texInstallStatus.state === 'running'">
                  <button class="btn btn-danger btn-sm" @click="cancelTexInstall()">取消任务</button>
                </template>
              </div>
              <pre class="install-log-pre" x-text="(texInstallStatus.logs || []).join('\n') || '点击上方按钮即可开始安装或补全宏包，进度日志将在此实时显示。'"></pre>
            </div>
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showCompilerModal = false">关闭</button>
        <template x-if="compilerTab === 'config'">
          <button class="btn btn-indigo" @click="saveCompilerSettings()">保存设置</button>
        </template>
      </div>
    </div>
  </div>

            <label>版本说明</label>
            <input type="text" x-model="snapshotForm.message" placeholder="例如 吸纳王代理修改并导出 v2 交底书" />
          </div>
          <div class="form-field form-full">
            <label>版本标签 Tag（选填，方便后续对比）</label>
            <input type="text" x-model="snapshotForm.tag" placeholder="例如 v2-代理返稿" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showSnapshotModal = false">取消</button>
        <button class="btn btn-mint" @click="confirmCreateSnapshot()">保存快照</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" x-show="showRawFeedbackModal" @click.self="showRawFeedbackModal = false">
    <div class="modal">
      <div class="modal-header">
        <h3>粘贴代理师 / 审查员模糊意见原件</h3>
        <button class="link-btn" @click="showRawFeedbackModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field form-full">
            <label>来源标识</label>
            <input type="text" x-model="rawFeedbackForm.source_label" placeholder="例如 微信-李代理 / 一通审查意见 OA1" />
          </div>
          <div class="form-field form-full">
            <label>原始文本（可直接粘贴聊天记录、邮件或扫描 OCR 文本）</label>
            <textarea rows="6" x-model="rawFeedbackForm.raw_text" placeholder="把零散模糊的反馈原封不动贴在这里，随后可配合 AI 提示词自动拆解..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showRawFeedbackModal = false">取消</button>
        <button class="btn btn-indigo" @click="saveRawFeedback()">存入收件箱</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" x-show="showFeedbackItemModal" @click.self="showFeedbackItemModal = false">
    <div class="modal">
      <div class="modal-header">
        <h3 x-text="feedbackItemForm.isEdit ? '编辑结构化意见卡' : '新增专利修改 / 确认卡'"></h3>
        <button class="link-btn" @click="showFeedbackItemModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field">
            <label>意见来源</label>
            <select x-model="feedbackItemForm.source">
              <option value="agent">专利代理师</option>
              <option value="examiner">审查员 OA</option>
              <option value="internal">内部自查</option>
            </select>
          </div>
          <div class="form-field">
            <label>状态</label>
            <select x-model="feedbackItemForm.status">
              <option value="pending">待修改</option>
              <option value="need_confirm">需与代理确认</option>
              <option value="revised">已改稿待核</option>
              <option value="resolved">已闭环</option>
            </select>
          </div>
          <div class="form-field form-full">
            <label>原始模糊表述（保留代理/审查员原话，防止语义丢失）</label>
            <textarea rows="2" x-model="feedbackItemForm.original_fuzzy_note"></textarea>
          </div>
          <div class="form-field form-full">
            <label>拆解后的可执行修改措施</label>
            <textarea rows="2" x-model="feedbackItemForm.action_plan"></textarea>
          </div>
          <div class="form-field form-full">
            <label>需反问确认的模糊点（选填）</label>
            <input type="text" x-model="feedbackItemForm.clarification_question" placeholder="例如：独权是否只需保留阈值存在性，具体 0.55 放到从权？" />
          </div>
          <div class="form-field form-full">
            <label>关联章节 / 附图</label>
            <input type="text" x-model="feedbackItemForm.target_section" placeholder="例如 二、技术方案 (模块 102)" />
          </div>
          <div class="form-field form-full">
            <label>回复 / 陈述草稿</label>
            <textarea rows="2" x-model="feedbackItemForm.reply_draft"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="showFeedbackItemModal = false">取消</button>
        <button class="btn btn-indigo" @click="saveFeedbackItem()">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" x-show="showReplyExportModal" @click.self="showReplyExportModal = false">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>专利代理沟通确认单 / 修改回复草稿</h3>
        <button class="link-btn" @click="showReplyExportModal = false">✕</button>
      </div>
      <div class="modal-body">
        <textarea class="export-area" rows="16" readonly x-model="patentReplyExportContent"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" @click="copyAiPrompt(patentReplyExportContent, 'pat_reply')" x-text="aiCopyTag === 'pat_reply' ? '✓ 已复制' : '复制全文'"></button>
        <button class="btn btn-mint" @click="exportPatentReplyWord()">同步导出 Word 确认单</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" x-show="lightboxFigureUrl" @click.self="lightboxFigureUrl = ''">
    <div class="modal modal-lg" style="text-align:center;">
      <div class="modal-header">
        <h3>附图大图预览</h3>
        <button class="link-btn" @click="lightboxFigureUrl = ''">✕</button>
      </div>
      <div class="modal-body">
        <img :src="lightboxFigureUrl" style="max-width:100%;max-height:70vh;border-radius:10px;" />
      </div>
    </div>
  </div>

  <div class="toast" x-show="toastMessage" x-text="toastMessage"></div>
</body>
</html>
